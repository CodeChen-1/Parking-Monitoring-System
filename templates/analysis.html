{% extends "base.html" %}
{% block title %}Analysis{% endblock %}

{% block content %}
    <h2 class="mb-4">Car Entry Analysis</h2>

<div class="btn-group mb-3" role="group">
  <button type="button" class="btn btn-primary" onclick="showChart('weekly')">Weekly</button>
  <button type="button" class="btn btn-primary" onclick="showChart('monthly')">Monthly</button>
  <button type="button" class="btn btn-primary" onclick="showChart('yearly')">Yearly</button>
</div>

<div class="container my-4">
  <div class="card" id="weeklyContainer">
    <div class="card-header">
      Weekly Report
    </div>
    <div class="card-body">
      <canvas id="weeklyChart"></canvas>
    </div>
  </div>

  <div class="card mt-4" id="monthlyContainer" style="display: none;">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Monthly Report</span>
      <span id="monthlyLabel" class="text-muted small"></span>
    </div>
    <div class="card-body">
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>

  <div class="card mt-4" id="yearlyContainer" style="display: none;">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Yearly Report</span>
      <span id="yearlyLabel" class="text-muted small"></span>
    </div>
    <div class="card-body">
      <canvas id="yearlyChart"></canvas>
    </div>
  </div>
</div>


{% endblock %}

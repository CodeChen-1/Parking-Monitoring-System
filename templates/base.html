<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Plate System{% endblock %}</title>

  <!-- Bootstrap -->  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
  {% if not hide_nav %}
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid d-flex justify-content-between align-items-center px-4">
      <a class="navbar-brand" href="{{ url_for('logs') }}">Car Plate System</a>
      <div class="d-flex justify-content-center flex-grow-1">
        <ul class="navbar-nav mb-0">
          <li class="nav-item px-2"><a class="nav-link" href="{{ url_for('live') }}">Live View</a></li>
          <li class="nav-item px-2"><a class="nav-link" href="{{ url_for('logs') }}">Logs</a></li>
          <li class="nav-item px-2"><a class="nav-link" href="{{ url_for('analysis') }}">Analysis</a></li>
        </ul>
      </div>
      {% if session.get('user') %}
      <div class="d-flex align-items-center">
        <span class="text-light me-3">Hi, {{ session['user'] }}</span>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Logout</a>
      </div>
      {% endif %}
    </div>
  </nav>
  {% endif %}

  <!-- Main Content -->
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055">
  <div id="plateToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage">
        Plate detected!
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
